<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后端学习手册</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20261030">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">&gt;_</div>
        <div class="brand-text">
          <strong id="brandTitle">后端学习手册</strong>
          <span>Linux · PM2 · 代理 · 排查</span>
        </div>
      </div>

      <div class="section-label">分类</div>
      <nav class="nav" id="navList"></nav>

      <div class="section-label">最近更新</div>
      <ul class="recent-list" id="recentList"></ul>

      <div class="sidebar-note">
        数据来自 <code>data/knowledge.js</code><br>
        新增条目后刷新页面即可，双击本文件也能打开。
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2"></path>
          </svg>
          <input id="searchInput" type="text" placeholder="搜索命令、关键词、标签，多个关键词用空格分隔" autocomplete="off">
          <kbd>/</kbd>
          <button class="clear-btn" id="clearSearch" type="button" title="清空搜索">×</button>
        </div>
        <div class="total">共 <span id="totalCount">0</span> 条</div>
      </header>

      <section class="content">
        <div class="page-head">
          <h1 id="pageTitle">全部知识</h1>
          <p id="pageDesc">按分类浏览，或者直接搜索你要用的命令。</p>
          <div class="tag-row" id="tagRow"></div>
        </div>

        <div class="message" id="appMessage" hidden></div>
        <div class="card-list" id="cardList"></div>
        <div class="empty" id="emptyState" hidden>
          <p>没有匹配的条目</p>
          <button type="button" id="resetFilter">清除筛选条件</button>
        </div>
      </section>
    </main>
  </div>

  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-resizer" id="drawerResizer" title="左右拖动调整宽度"></div>
    <header class="drawer-head">
      <div>
        <span class="drawer-category" id="drawerCategory"></span>
        <h2 id="drawerTitle"></h2>
        <div class="drawer-meta" id="drawerMeta"></div>
      </div>
      <button class="drawer-close" id="drawerClose" type="button" title="关闭（Esc）">×</button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast">已复制</div>

  <script src="assets/vendor/jquery-3.7.1.min.js"></script>
  <script src="data/knowledge.js?v=20261030"></script>
  <script src="assets/js/app.js?v=20261030b"></script>
</body>
</html>
